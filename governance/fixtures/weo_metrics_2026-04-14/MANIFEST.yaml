# Phase-1 WEO metric snapshots — deterministic offline fixture
#
# Companion to weo_2026-04-14/. That directory pins the UNIVERSE (NGDPD at the reference year
# plus the 2025-2031 rejection horizon). This directory pins the METRIC PANELS over the full
# release window, so metric ingestion, coverage and ranking can be tested without a network
# call — the gap Codex identified: the universe fixture alone cannot supply debt or any other
# WEO metric, and nothing may be fabricated from a coverage report.
#
# All seven files are the SAME VINTAGE as the universe fixture. Verified on load, not assumed.

vintage:
  dataflow: "IMF.RES,WEO,9.0.0"
  publication_date: "2026-04-14T13:00:00Z"
  update_date: "2026-04-15T13:00:00Z"

request_headers:
  User-Agent: "curl/8.5.0"            # Node default and Mozilla UAs receive HTTP 403
  Accept: "application/vnd.sdmx.data+csv;version=1.0.0"
retrieved_at: "2026-08-22"
endpoint_base: "https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO,9.0.0"
release_window: { start_year: 1990, end_year: 2025 }   # matches gei/config.py START_YEAR/END_YEAR

