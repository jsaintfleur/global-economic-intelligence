not_included:
  - indicator: LUR
    reason: >
      Unemployment remains World Bank SL.UEM.TOTL.ZS until D-008 is formally superseded.
      Shipping a WEO LUR snapshot here would imply a substitution that has not been
      adjudicated. Available on request once that decision is made.
  - indicator: PPPPC
    reason: >
      Not a Phase-1 registry metric. When added, note it publishes NO
      LATEST_ACTUAL_ANNUAL_DATA attribute and inherits its boundary from NGDPD.

replay_contract: |
  1. Verify each file's sha256 against this manifest before parsing.
  2. Verify PUBLICATION_DATE on every file equals the vintage block above. A mixed-vintage
     fixture set is the failure this check exists to catch: each file would pass its own hash
     while the panel silently spanned two WEO editions.
  3. Drop rows with an empty TIME_PERIOD before year keying.
  4. Empty OBS_VALUE is not zero.
  5. Normalise FY(YYYY)/YY boundaries to the first year.
  6. Classify COUNTRY codes against governance/entities/imf_weo_reference_list.yaml; fail
     closed on any code absent from it.
  7. No network call anywhere in this path.

  Refreshing the vintage re-fetches EVERY file from its own request_url, regenerates all
  hashes, and re-pins expectations. Never partially.
