# Undeclared code observed in data but ABSENT from CL_COUNTRY(1.6.0): GX123.
# It appears in the NGDPD 2024 response as an aggregate. The adapter must FAIL on any
# COUNTRY code absent from this reference list rather than defaulting it to economy —
# otherwise an undeclared aggregate enters the universe silently. GX123 is the proof that
# undeclared codes occur in practice, not just in principle.
undeclared_observed:
  - {code: GX123, note: "present in WEO NGDPD data, absent from CL_COUNTRY; treat as aggregate"}

# Required adapter behaviour (D-003):
#   1. Load this reference list.
#   2. A candidate is admitted ONLY if its code appears under `economy`.
#   3. Any code not present anywhere in this file FAILS the build. Do not default-admit.
#   4. Never infer status from code shape, name text, region, or adminregion.
