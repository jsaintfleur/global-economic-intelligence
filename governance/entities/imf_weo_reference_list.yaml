# IMF WEO country-dimension reference list — aggregate exclusion (D-003)
#
# Authority: Claude (Agent A). Supplies the reference list D-003 requires so the adapter
# excludes aggregates by explicit membership, never by code shape.
#
# Source:   https://api.imf.org/external/sdmx/2.1/codelist/IMF/CL_COUNTRY
# Codelist: IMF:CL_COUNTRY(1.6.0)   retrieved 2026-08-22
# Codes:    343
#
# THE POINT OF THIS FILE, stated plainly: CL_COUNTRY contains SIX aggregate codes that are
# exactly three uppercase letters — AFR, APD, EUR, MCD, WHD (IMF area departments) and SDS
# (Small Developing States). A /^[A-Z]{3}$/ filter admits every one of them. They are not
# hypothetical future codes; they are in the codelist today. WEO does not currently publish
# NGDPD for them, which is the only reason a shape filter has not already corrupted a
# ranking. That is luck, and it expires without warning.
#
