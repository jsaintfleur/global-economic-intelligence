<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="?view=overview" aria-label="Atlas home"><span class="brand-mark">A</span><span>ATLAS<small>Economic intelligence</small></span></a>
      <nav id="nav">
        <span class="nav-label">Intelligence</span>
        <button data-view="overview" class="active"><i>01</i>Overview</button>
        <button data-view="country"><i>02</i>Economies</button>
        <button data-view="compare"><i>03</i>Compare</button>
        <span class="nav-label">Research</span>
        <button data-view="rankings"><i>04</i>Rankings</button>
        <button data-view="data"><i>05</i>Explore</button>
        <button data-view="coverage"><i>06</i>Coverage</button>
        <button data-view="methodology"><i>07</i>Methodology</button>

      <div class="sidebar-foot"><i></i><span>IMF WEO + World Bank WDI<br><b id="freshness">Loading sources…</b></span></div>

  <dialog id="command-dialog" class="command-dialog" aria-label="Search Atlas"><form method="dialog"><div class="command-head"><label for="command-input">Search economies, metrics, and analysis</label><button aria-label="Close search">Esc</button></div><input id="command-input" autocomplete="off" placeholder="Try “Japan”, “debt ranking”, or “compare US China”"><div id="command-results" role="listbox"></div><p class="command-hint">↑↓ Navigate · Enter Open · Esc Close</p></form></dialog>
